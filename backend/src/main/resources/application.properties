# A Porta Dinamica do Heroku
server.port=${PORT:8080}

# Database Configuration (Lê do Heroku ou usa H2 localmente)
spring.datasource.url=${JDBC_DATABASE_URL:jdbc:h2:mem:splittripdb}
spring.datasource.username=${JDBC_DATABASE_USERNAME:sa}
spring.datasource.password=${JDBC_DATABASE_PASSWORD:password}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}

# Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=${DB_DIALECT:org.hibernate.dialect.H2Dialect}
spring.jpa.show-sql=true

# JSON formatting fix
spring.jackson.serialization.fail-on-empty-beans=false
spring.jackson.generator.write-bigdecimal-as-plain=false
spring.jackson.generator.write-numbers-as-strings=false